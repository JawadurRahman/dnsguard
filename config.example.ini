; Copy this file to ~/.dnsguard/config.ini (Windows: C:\Users\<you>\.dnsguard\config.ini)
; and fill it in. Keep config.ini private: the link_ip_url contains a secret token.

[dnsguard]
; Hardware (MAC) address of your router. dnsguard only changes the router when the
; device at router_host has this address, so it does nothing on other networks.
; Find it with:  arp -a 192.168.2.1   (Windows)   or   ip neigh show 192.168.2.1   (Linux)
router_mac = aa:bb:cc:dd:ee:ff

; NextDNS dashboard -> Setup tab -> "IPv4" section
nextdns_primary = 45.90.28.0
nextdns_secondary = 45.90.30.0

; NextDNS dashboard -> Setup tab -> "Linked IP" -> update URL (optional, recommended).
; Keeps your home IP linked to your profile when your ISP changes it.
link_ip_url = https://link-ip.nextdns.io/<profile-id>/<secret>

; Optional: ntfy topic URL for phone alerts, e.g. https://ntfy.sh/<your-topic>
ntfy_url =

; Optional (defaults shown)
; router_host = 192.168.2.1
; router_user = admin
; check_every_seconds = 60
